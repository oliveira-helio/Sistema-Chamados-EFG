services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_initial_data && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      DEBUG: "1"
      SECRET_KEY: "change-me"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: "postgresql://chamados:chamados@db:5432/chamados"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chamados
      POSTGRES_USER: chamados
      POSTGRES_PASSWORD: chamados
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamados -d chamados"]
      interval: 5s
      timeout: 5s
      retries: 10

  scheduler:
    build: .
    command: sh /app/docker/entrypoint-scheduler.sh
    volumes:
      - .:/app
    restart: unless-stopped
    environment:
      DEBUG: "1"
      SECRET_KEY: "change-me"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: "postgresql://chamados:chamados@db:5432/chamados"
      SCHEDULER_INTERVAL_SECONDS: "60"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  media_data:
