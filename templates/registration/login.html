{% extends "base.html" %}
{% block title %}Entrar | Sistema de Chamados{% endblock %}
{% block content %}
<section class="hero">
  <div class="hero-copy">
    <p class="eyebrow">Acesso interno da escola</p>
    <h1>Entre com sua matrícula ou e-mail.</h1>
    <p>Uma interface simples, responsiva e pronta para celular e computador.</p>
  </div>
  <form class="card form-card" method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label>{{ form.username.label }} {{ form.username }}</label>
    <label>{{ form.password.label }} {{ form.password }}</label>
    <button class="primary" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
