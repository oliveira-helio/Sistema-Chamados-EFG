{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="section-head">
    <div>
      <p class="eyebrow">Novo chamado</p>
      <h1>Abrir demanda</h1>
    </div>
  </div>
  <form class="card form-stack" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label>Departamento de destino {{ form.department }}</label>
    <label>Categoria {{ form.category }}</label>
    <label>Titulo {{ form.title }}</label>
    <label>Descricao {{ form.description }}</label>
    <label>Urgencia {{ form.urgency }}</label>
    <label>Anexo inicial {{ form.initial_attachment }}</label>
    <button class="primary" type="submit">Criar chamado</button>
  </form>
</section>
<script>
  (function () {
    const departmentField = document.getElementById("id_department");
    const categoryField = document.getElementById("id_category");
    if (!departmentField || !categoryField) return;

    const endpoint = "{% url 'ticket_categories_api' %}";

    const selectedCategory = categoryField.value;

    function setOptions(categories) {
      categoryField.innerHTML = '<option value="">---------</option>';
      categories.forEach((category) => {
        const option = document.createElement("option");
        option.value = category.id;
        option.textContent = category.name;
        if (String(category.id) === String(selectedCategory)) {
          option.selected = true;
        }
        categoryField.appendChild(option);
      });
    }

    async function loadCategories(department) {
      if (!department) {
        setOptions([]);
        return;
      }
      const response = await fetch(`${endpoint}?department=${encodeURIComponent(department)}`);
      const payload = await response.json();
      setOptions(payload.categories || []);
    }

    departmentField.addEventListener("change", (event) => {
      categoryField.value = "";
      loadCategories(event.target.value);
    });

    if (departmentField.value) {
      loadCategories(departmentField.value);
    }
  })();
</script>
{% endblock %}
