{% extends "base.html" %}
{% block content %}
<section class="section">
  <div class="section-head">
    <div>
      <p class="eyebrow">Usuarios</p>
      <h1>{{ title }}</h1>
    </div>
  </div>

  <form class="card form-stack" method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% if form.errors %}
      <div class="alert error">
        <strong>Nao foi possivel alterar a senha.</strong>
        <div>Confira os campos informados.</div>
      </div>
    {% endif %}
    <label>Nova senha {{ form.new_password1 }}</label>
    {{ form.new_password1.errors }}
    <label>Confirmar senha {{ form.new_password2 }}</label>
    {{ form.new_password2.errors }}
    <button class="primary" type="submit">Salvar senha</button>
  </form>
</section>
{% endblock %}
